name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # DPAPI tests only run on Windows; they are skipped on Linux.
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7

      # The .NET 10 SDK builds everything (global.json picks it); the .NET 9 runtime runs the net9.0 tests.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Build
        run: dotnet build --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --logger "console;verbosity=normal"

      - name: Pack (both target frameworks)
        if: runner.os == 'Linux'
        run: |
          dotnet pack Lockbox --configuration Release --output artifacts
          dotnet pack Lockbox.Cli --configuration Release --output artifacts
          for pkg in artifacts/Lockbox.*.nupkg; do
            for tfm in net9.0-windows7.0 net10.0-windows7.0; do
              unzip -l "$pkg" | grep -q "lib/$tfm/" || { echo "$pkg has no lib/$tfm"; exit 1; }
            done
          done

      - name: End-to-end (samples, real DPAPI)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./samples/e2e.ps1
